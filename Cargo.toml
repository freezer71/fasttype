[workspace]
resolver = "3"
members = ["crates/fasttype-core", "crates/fasttype-data", "crates/fasttype-store", "crates/fasttype-tui", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"
repository = "https://github.com/freezer71/fasttype"

[workspace.dependencies]
ratatui = "0.30.2"
crossterm = "0.29.0"
unicode-width = "0.2.2"
signal-hook = "0.3.18"
libc = "0.2.190"
fontdue = "0.9.4"
miniz_oxide = "0.9.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
proptest = "1.11.0"
criterion = "0.8.2"
fasttype-core = { path = "crates/fasttype-core" }
fasttype-data = { path = "crates/fasttype-data", default-features = false }
fasttype-store = { path = "crates/fasttype-store" }
zstd = "0.14.0"
sha2 = "0.11.0"
toml = "1.1.6"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

# Les tests décompressent et analysent 135 Mo de JSON : optimisés même en dev.
[profile.dev.package.fasttype-data]
opt-level = 2

[profile.dev.package."*"]
opt-level = 2
