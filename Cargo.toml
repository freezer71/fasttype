[workspace]
resolver = "3"
members = ["crates/fasttype-core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-only"
rust-version = "1.97"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
proptest = "1.11.0"
criterion = "0.8.2"

[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"
